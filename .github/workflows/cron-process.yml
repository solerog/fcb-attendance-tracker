name: Daily Process and Reminders

on:
  schedule:
    - cron: "10 7 * * *" # daily at 07:10 UTC
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.3"
          python-version: "3.14"
          enable-cache: true
      - name: Sync project (install deps)
        run: |
          uv sync --dev
      - name: Process attendance and send reminders
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          uv run python actions/process_attendance.py
          uv run python actions/send_reminders.py
