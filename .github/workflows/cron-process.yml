name: Daily Process and Reminders

on:
  # schedule:
  #  - cron: "10 7 * * *" # daily at 07:10 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          python-version: "3.14"
          enable-cache: true
      - name: Sync project (install deps)
        run: |
          uv sync --dev
      - name: Process attendance and send reminders
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          uv run python actions/process_attendance.py
          uv run python actions/send_reminders.py
