name: Daily Process and Reminders

on:
  schedule:
    - cron: "10 7 * * *" # daily at 07:10 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          python-version: "3.14"
          enable-cache: true
      - name: Sync project (install deps)
        run: |
          uv sync --dev
      - name: Process attendance and send reminders
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          uv run python actions/process_attendance.py
          uv run python actions/send_reminders.py
      - name: Commit data changes and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH_BASE: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data || true
          if ! git diff --quiet --cached; then
            branch="data-update-$(date +%Y%m%d%H%M%S)"
            git checkout -b "$branch"
            git commit -m "Update data from cron process" || true
            git push --set-upstream origin "$branch"
            echo "Creating pull request for $branch -> $BRANCH_BASE"
            payload=$(cat <<EOF
{"title":"Automated data update","head":"$branch","base":"$BRANCH_BASE","body":"Automated data update from cron process"}
EOF
)
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/$REPO/pulls -d "$payload" || true
          else
            echo "No data changes"
          fi
