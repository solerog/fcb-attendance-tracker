name: Fetch team matches & open ticket requests

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Setup the repository and install dependencies
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
          python-version: "3.14"
          enable-cache: true
      - name: Sync project (install deps)
        run: |
          uv sync --dev
      # Run scripts to fetch matches and check requests
      - name: Run fetch and check scripts
        id: fetch_matches
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          uv run python -m actions.fetch_matches
          uv run python -m actions.fetch_open_requests
      # Commit changes and create a pull request if there are any updates
      - name: Create Pull Request
        if: steps.fetch_matches.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/update-matches
          base: main
          title: "Update matches"
          commit-message: |
            bot: Update matches.json
            Automatic update of `matches.json`.
            Github action run on ${{ steps.vars.outputs.timestamp }}.
      - name: Enable auto merge
        if: steps.fetch_matches.outputs.updated == 'true'
        run: |
          gh pr merge \
          --squash \
          --delete-branch \
          bot/update-matches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
